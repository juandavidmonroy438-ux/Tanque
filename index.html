<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nivel del tanque</title>
<style>
  :root{--bg:#0f1b24;--fg:#e8f1f5;--mut:#8aa3b2;--agua:#2fa4e7;--ok:#3ecf8e;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;padding:16px}
  h1{font-size:1.1rem;font-weight:600;margin:0;color:var(--mut)}
  .tanque{width:140px;height:240px;border:3px solid var(--mut);border-radius:10px;position:relative;overflow:hidden}
  #agua{position:absolute;left:0;right:0;bottom:0;height:0%;background:var(--agua);transition:height .6s}
  #pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.4rem;font-weight:700;text-shadow:0 1px 6px #000}
  #estado{font-size:.9rem;color:var(--mut)}
  #estado.ok{color:var(--ok)} #estado.err{color:var(--err)}
  #raw{font-size:.75rem;color:var(--mut);max-width:90vw;word-break:break-all}
</style>
</head>
<body>
  <h1>Nivel del tanque · HC-SR04</h1>
  <div class="tanque"><div id="agua"></div><div id="pct">--%</div></div>
  <div id="estado">Conectando…</div>
  <div id="raw"></div>

<script>
// ====== CONFIGURACIÓN (ajusta si hace falta) ======
const ENDPOINT = "https://cygnus.uniajc.edu.co/appis/ldispositivo.php?id=211&c=hc1";
const CADA_MS  = 3000;      // cada cuántos ms consulta
const CLAVE    = "";        // si la respuesta es JSON, nombre del campo (vacío = detecta el primer número)
// ==================================================

// Intenta directo; si el navegador bloquea (CORS / contenido mixto), usa proxies públicos.
const RUTAS = [
  u => u,
  u => "https://api.allorigins.win/raw?url=" + encodeURIComponent(u),
  u => "https://corsproxy.io/?" + encodeURIComponent(u)
];

function extraerNumero(texto){
  try{
    let j = JSON.parse(texto);
    if (Array.isArray(j)) j = j[j.length-1];
    if (j && typeof j === "object"){
      if (CLAVE && j[CLAVE] !== undefined) return parseFloat(j[CLAVE]);
      for (const k in j){ const n = parseFloat(j[k]); if (!isNaN(n)) return n; }
    } else if (!isNaN(parseFloat(j))) return parseFloat(j);
  }catch(e){}
  const m = texto.match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : NaN;
}

async function leer(){
  const est = document.getElementById("estado");
  for (const ruta of RUTAS){
    try{
      const r = await fetch(ruta(ENDPOINT) + (ENDPOINT.includes("?")?"&":"?") + "_=" + Date.now(), {cache:"no-store"});
      if (!r.ok) throw new Error("HTTP " + r.status);
      const t = await r.text();
      if (/^\s*<(!doctype|html)/i.test(t)) throw new Error("el servidor devolvió una página HTML (ruta incorrecta)");
      const n = extraerNumero(t);
      if (isNaN(n)) throw new Error("sin número en la respuesta");
      const p = Math.max(0, Math.min(100, n));
      document.getElementById("agua").style.height = p + "%";
      document.getElementById("pct").textContent = Math.round(p) + "%";
      document.getElementById("raw").textContent = "Respuesta: " + t.slice(0,150);
      est.textContent = "En vivo · " + new Date().toLocaleTimeString();
      est.className = "ok";
      return;
    }catch(e){ est.textContent = "Reintentando… (" + e.message + ")"; est.className = "err"; }
  }
}
leer(); setInterval(leer, CADA_MS);
</script>
</body>
</html>
