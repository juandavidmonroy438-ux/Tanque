<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Consola IoT — Nivel de tanque</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1116;
    --grid-line: rgba(255,255,255,0.028);
    --panel: #161c22;
    --panel-2: #12171d;
    --border: #262f37;
    --text: #dfe8e6;
    --muted: #6e8086;
    --cyan: #4fd1c5;
    --water: #3aa8d8;
    --amber: #e8a355;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0/ 100% 34px,
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0/ 34px 100%,
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 40px 20px;
  }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  .console { width: 100%; max-width: 760px; }

  .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .bar-left { display: flex; align-items: baseline; gap: 10px; }
  .bar h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.02em; margin: 0; }
  .device-tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 2px 7px; }
  .live { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--cyan); animation: pulse 2s ease-out infinite; }
  .live-dot.off { background: var(--amber); animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(79,209,197,.55); }
    70%  { box-shadow: 0 0 0 8px rgba(79,209,197,0); }
    100% { box-shadow: 0 0 0 0 rgba(79,209,197,0); }
  }

  .frame { position: relative; background: var(--panel); border: 1px solid var(--border); padding: 30px; }
  .corner-tl, .corner-br { position: absolute; width: 14px; height: 14px; }
  .corner-tl { top: -1px; left: -1px; border-top: 2px solid var(--cyan); border-left: 2px solid var(--cyan); }
  .corner-br { bottom: -1px; right: -1px; border-bottom: 2px solid var(--cyan); border-right: 2px solid var(--cyan); }

  .grid-main { display: grid; grid-template-columns: 230px 1fr; gap: 28px; }
  @media (max-width: 620px) { .grid-main { grid-template-columns: 1fr; } }

  /* ---------- Tanque ---------- */
  .tank-col { display: flex; flex-direction: column; align-items: center; }
  .tank-wrap { position: relative; width: 210px; height: 240px; }
  .tank-wrap svg { display: block; width: 100%; height: 100%; }
  .tank-body { fill: var(--panel-2); stroke: #3a4752; stroke-width: 3; }
  .tick { stroke: #3a4752; stroke-width: 1.5; }
  .tick-label { fill: var(--muted); font: 500 9px 'JetBrains Mono', monospace; }
  #agua { transform: translateY(200px); transition: transform 1s ease; }
  .water-fill { fill: var(--water); fill-opacity: .85; transition: fill .4s ease; }
  .ola { animation: ola 3s linear infinite; }
  @keyframes ola { from { transform: translateX(0); } to { transform: translateX(-60px); } }
  .low .water-fill { fill: var(--amber); }

  .tank-center {
    position: absolute; left: 0; top: 0; width: 150px; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; padding-left: 30px;
  }
  #valor { font-size: 38px; font-weight: 600; line-height: 1; text-shadow: 0 1px 6px rgba(0,0,0,.65); }
  #valor .unidad { font-size: 18px; margin-left: 2px; opacity: .8; }
  .tank-label { margin-top: 6px; font-size: 11.5px; color: var(--text); text-shadow: 0 1px 4px rgba(0,0,0,.7); }

  .aviso { margin-top: 12px; min-height: 18px; font-size: 12px; color: var(--amber); text-align: center; }

  /* ---------- Datos ---------- */
  .stat-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: var(--border); border: 1px solid var(--border); margin-bottom: 20px; }
  .stat { background: var(--panel-2); padding: 12px 14px; }
  .stat .k { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .stat .v { font-size: 17px; }
  .section-label { font-size: 11.5px; color: var(--muted); margin: 0 0 8px; }
  .spark-wrap { border: 1px solid var(--border); background: var(--panel-2); padding: 12px 14px 8px; margin-bottom: 20px; }
  #sparkline { display: block; width: 100%; height: 56px; }
  .log { border: 1px solid var(--border); background: var(--panel-2); }
  .log-row { display: flex; justify-content: space-between; padding: 8px 14px; font-size: 12.5px; border-bottom: 1px solid var(--border); }
  .log-row:last-child { border-bottom: none; }
  .log-row .t { color: var(--muted); }
  .log-empty { padding: 14px; font-size: 12.5px; color: var(--muted); text-align: center; }
  .footer { display: flex; justify-content: space-between; margin-top: 14px; font-size: 11.5px; color: var(--muted); }
  .footer .v.error { color: var(--amber); }

  @media (prefers-reduced-motion: reduce) { .ola, .live-dot { animation: none; } #agua { transition: none; } }
</style>
</head>
<body>

  <div class="console">

    <div class="bar">
      <div class="bar-left">
        <h1>Consola IoT</h1>
        <span class="device-tag mono">HC-SR04 · id 217</span>
      </div>
      <div class="live">
        <span class="live-dot" id="liveDot"></span>
        <span id="liveLabel">en vivo</span>
      </div>
    </div>

    <div class="frame">
      <span class="corner-tl"></span><span class="corner-br"></span>

      <div class="grid-main">

        <div class="tank-col">
          <div class="tank-wrap" id="tankWrap">
            <svg viewBox="0 0 210 240" aria-label="Tanque de agua">
              <defs>
                <clipPath id="clipTanque"><rect x="30" y="20" width="120" height="190" rx="10"/></clipPath>
              </defs>
              <rect class="tank-body" x="30" y="20" width="120" height="190" rx="10"/>
              <g clip-path="url(#clipTanque)">
                <g id="agua">
                  <g transform="translate(30,0)">
                    <path class="ola water-fill"
                          d="M0 0 q15 -6 30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 t30 0 V220 H0 Z"/>
                  </g>
                </g>
              </g>
              <!-- Escala: 100% en y=20, 0% en y=210 -->
              <g>
                <line class="tick" x1="150" y1="20"  x2="158" y2="20"/>
                <line class="tick" x1="150" y1="67.5" x2="158" y2="67.5"/>
                <line class="tick" x1="150" y1="115" x2="158" y2="115"/>
                <line class="tick" x1="150" y1="162.5" x2="158" y2="162.5"/>
                <line class="tick" x1="150" y1="210" x2="158" y2="210"/>
                <text class="tick-label" x="162" y="23">100</text>
                <text class="tick-label" x="162" y="70.5">75</text>
                <text class="tick-label" x="162" y="118">50</text>
                <text class="tick-label" x="162" y="165.5">25</text>
                <text class="tick-label" x="162" y="213">0</text>
              </g>
            </svg>
            <div class="tank-center">
              <div id="valor" class="mono">---<span class="unidad">%</span></div>
              <div class="tank-label">nivel del tanque</div>
            </div>
          </div>
          <div class="aviso" id="aviso"></div>
        </div>

        <div class="data-col">

          <div class="stat-row">
            <div class="stat"><div class="k">lecturas</div><div class="v mono" id="statCount">0</div></div>
            <div class="stat"><div class="k">mínimo</div><div class="v mono" id="statMin">—</div></div>
            <div class="stat"><div class="k">máximo</div><div class="v mono" id="statMax">—</div></div>
          </div>

          <p class="section-label">Tendencia (últimas lecturas)</p>
          <div class="spark-wrap">
            <svg id="sparkline" viewBox="0 0 300 56" preserveAspectRatio="none">
              <polyline id="sparkLine" fill="none" stroke="#3aa8d8" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round" points=""></polyline>
            </svg>
          </div>

          <p class="section-label">Bitácora</p>
          <div class="log" id="log">
            <div class="log-empty">esperando primera lectura…</div>
          </div>

        </div>
      </div>
    </div>

    <div class="footer">
      <span>endpoint: <span class="mono">…/ldispositivo.php?id=217</span></span>
      <span>estado: <span class="v mono" id="estadoValor">esperando…</span></span>
    </div>

  </div>

<script>
  // Debe coincidir con el canal (c=) que usa el ESP32 al enviar el dato
  const URL_SENSOR = "https://cygnus.uniajc.edu.co/appis/ldispositivo.php?id=217&c=dht1";
  const INTERVALO_MS = 2000;
  const MAX_HISTORIAL = 20;
  const MAX_LOG = 6;
  const NIVEL_BAJO = 20;      // % por debajo del cual se muestra alerta

  // Geometría del tanque en el SVG: 100% -> y=20, 0% -> y=210
  const Y_LLENO = 20, Y_VACIO = 210;

  const historial = [];

  const elValor = document.getElementById("valor");
  const elAgua = document.getElementById("agua");
  const elTank = document.getElementById("tankWrap");
  const elAviso = document.getElementById("aviso");
  const elEstadoValor = document.getElementById("estadoValor");
  const elLiveDot = document.getElementById("liveDot");
  const elLiveLabel = document.getElementById("liveLabel");
  const elStatCount = document.getElementById("statCount");
  const elStatMin = document.getElementById("statMin");
  const elStatMax = document.getElementById("statMax");
  const elSparkLine = document.getElementById("sparkLine");
  const elLog = document.getElementById("log");

  function pintarTanque(pct) {
    const p = Math.max(0, Math.min(100, pct));
    const y = p <= 0 ? Y_VACIO + 12 : Y_VACIO - (Y_VACIO - Y_LLENO) * p / 100;
    elAgua.style.transform = "translateY(" + y.toFixed(1) + "px)";

    const bajo = p < NIVEL_BAJO;
    elTank.classList.toggle("low", bajo);
    elAviso.textContent = bajo ? "Nivel bajo: conviene llenar el tanque" : "";
  }

  function actualizarSparkline() {
    if (historial.length < 2) { elSparkLine.setAttribute("points", ""); return; }
    const paso = 300 / (MAX_HISTORIAL - 1);
    const offset = MAX_HISTORIAL - historial.length;
    // Escala fija 0-100% para ver la subida/bajada real del tanque
    const pts = historial.map((valor, i) => {
      const x = (offset + i) * paso;
      const y = 52 - (valor / 100) * 48;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");
    elSparkLine.setAttribute("points", pts);
  }

  function actualizarStats() {
    elStatCount.textContent = historial.length;
    elStatMin.textContent = historial.length ? Math.min(...historial).toFixed(1) + "%" : "—";
    elStatMax.textContent = historial.length ? Math.max(...historial).toFixed(1) + "%" : "—";
  }

  function agregarLog(valor, hora) {
    if (elLog.querySelector(".log-empty")) elLog.innerHTML = "";
    const row = document.createElement("div");
    row.className = "log-row";
    row.innerHTML = '<span class="h mono">' + valor.toFixed(1) + '%</span><span class="t mono">' + hora + '</span>';
    elLog.prepend(row);
    while (elLog.children.length > MAX_LOG) elLog.removeChild(elLog.lastChild);
  }

  async function leerSensor() {
    try {
      const respuesta = await fetch(URL_SENSOR, { cache: "no-store" });
      if (!respuesta.ok) throw new Error("HTTP " + respuesta.status);

      const texto = (await respuesta.text()).trim();
      const numero = parseFloat(texto.replace(",", "."));
      const hora = new Date().toLocaleTimeString();

      elValor.innerHTML = (isNaN(numero) ? texto : numero.toFixed(0)) + '<span class="unidad">%</span>';

      if (!isNaN(numero)) {
        pintarTanque(numero);
        historial.push(numero);
        if (historial.length > MAX_HISTORIAL) historial.shift();
        actualizarSparkline();
        actualizarStats();
        agregarLog(numero, hora);
      }

      elEstadoValor.classList.remove("error");
      elEstadoValor.textContent = "ok · " + hora;
      elLiveDot.classList.remove("off");
      elLiveLabel.textContent = "en vivo";

    } catch (error) {
      elEstadoValor.classList.add("error");
      elEstadoValor.textContent = "error: " + error.message;
      elLiveDot.classList.add("off");
      elLiveLabel.textContent = "sin conexión";
      console.error(error);
    }
  }

  leerSensor();
  setInterval(leerSensor, INTERVALO_MS);
</script>

</body>
</html>
